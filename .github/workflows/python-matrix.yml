name: python lint

on:
    workflow_dispatch:

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v7

            - name: set up python
              uses: actions/setup-python@v4
              with:
                  python-version: 3.11

            - name: install dependency
              run: pip install -r requirements.txt
            
            - name: check code lint
              run: flake8 app.py
            
