# workflow name 
name: Hello

# runs on a trigger
on:
  push:
    branches: [main]
    paths:
      - '**.html'
    
#These are jobs of the workflow
jobs:
  #this is the steps of the job
  greet:
    runs-on: ubuntu-latest # github runner
    steps:
      - name: Say hello to users
        run: echo "Hello Dosto"
      
      - name: say hello to users
        run: echo "Hello $USER" 
