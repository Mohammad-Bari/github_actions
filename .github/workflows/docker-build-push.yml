name: Docker Build and Push

on:
    push:
        branches:
            - main

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v4

            - name: Login to docker hub
              uses: docker/login-action@v4
              with:
                username: ${{vars.DOCKERHUB_USERNAME}}
                password: ${{secrets.DOCKERHUB_TOKEN}}


            - name: Build and Push to Docker Hub
              uses: docker/build-push-action@v7
              with:
                context: . #where is your docker file (same repo .)
                push: true
                tags: |
                    ${{vars.DOCKERHUB_USERNAME}}/github-action-app:${{github.ref_name}}
                    ${{vars.DOCKERHUB_USERNAME}}/github-action-app:${{github.sha}}
                    ${{vars.DOCKERHUB_USERNAME}}/github-action-app:latest

            