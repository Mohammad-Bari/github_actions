# scanning api , and secrets, using gitleaks, TruffleHog, GitHound, OWASP DeepSecrets
name: Secrets Scanning

on:
    workflow_call:

jobs:
    secrets-scan:
        runs-on: ubuntu-latest
        
        steps:
            - name: code checkout
              uses: actions/checkout@v4
              with:
                 fetch-depth: 0 # whole commit history will be fetched

            - name: run git leaks
              uses: gitleaks/gitleaks-action@v2
              env:
                GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}


# Github token
# GitHub generates GITHUB_TOKEN automatically at the start of every workflow run, so you do not need to create or configure it manually.

# How It Works

# • Automatic Creation. Whenever a GitHub Actions workflow starts, GitHub creates a unique, short-lived authentication token specifically for that job.
# • Built-in Reference. You access it using secrets.GITHUB_TOKEN inside your YAML file without adding anything to your repository's Settings > Secrets menu.
# • Automatic Expiration. The token expires as soon as the workflow job finishes or after a maximum of 24 hours.
# *
