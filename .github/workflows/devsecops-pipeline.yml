name: Devops End to End Pipeline

on:
    push:
        branches: [main]

jobs:
    code-quality:
        uses: ./.github/workflows/code-quality.yml
    
    secrets-scan:
        uses: ./.github/workflows/secrets_scanning.yml

    dependency-scan:
        uses: ./.github/workflows/dependency-scanning.yml

    docker-lint:
        uses: ./.github/workflows/docker-lint.yml

    # image-scan:
    #     uses: ./.github/workflows/image-scan.yml

    build:
        needs: [code-quality,secrets-scan,  dependency-scan, docker-lint]
        uses: ./.github/workflows/docker-build-push.yml
        secrets: inherit

    image-scan:
        needs: [build]
        uses: ./.github/workflows/image-scan.yml
        secrets: inherit