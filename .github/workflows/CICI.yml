#1 name of the workflow 
name: CICD

on:
  workflow_dispatch: 
# job of the workflow
jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: clone the code
        run: echo " code is cloned"
  build:
    runs-on: ubuntu-latest
    needs: code
    steps:
      - name: Build the code
        run: echo "build the code"
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: test the code
        run: echo "test the code"
  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: deploy the code
        run: echo "deploy the code"
